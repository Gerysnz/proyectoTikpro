<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Chamba</title>
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --green-forest: #2A9D8F;
                --blue-gray: #264653;
                --turquoise-light: #48B9B9;
                --beige-light: #F1F3F2;
                --gray-medium: #7C7C7C;
                --orange-bright: #FF6F3C;
            }
            body {
                margin: 0;
                font-family: 'Open Sans', Arial, sans-serif;
                background-color: var(--beige-light);
                color: var(--blue-gray);
            }
            header {
                background-color: white;
                padding: 20px 24px;
                border-bottom: 2px solid var(--green-forest);
                font-family: 'Poppins', sans-serif;
                font-weight: 700;
                font-size: 24px;
                color: var(--green-forest);
                text-align: center;
                letter-spacing: 2px;
            }
            .login-container {
                max-width: 370px;
                margin: 48px auto;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 6px 15px rgba(38, 70, 83, 0.10);
                padding: 2.5rem 2rem 2rem 2rem;
            }
            .login-container h2 {
                text-align: center;
                color: var(--green-forest);
                margin-bottom: 1.7rem;
                font-weight: 700;
                font-family: 'Poppins', sans-serif;
                font-size: 1.6rem;
            }
            .login-form {
                display: flex;
                flex-direction: column;
                gap: 1.2rem;
            }
            .login-form label {
                color: var(--blue-gray);
                font-size: 1rem;
                margin-bottom: 0.3rem;
                font-weight: 600;
            }
            .login-form input {
                padding: 0.7rem;
                border: 1.5px solid var(--green-forest);
                border-radius: 8px;
                font-size: 1rem;
                outline: none;
                background: var(--beige-light);
                transition: border-color 0.2s;
            }
            .login-form input:focus {
                border-color: var(--turquoise-light);
            }
            .login-form button {
                background: var(--green-forest);
                color: #fff;
                border: none;
                border-radius: 8px;
                padding: 0.9rem;
                font-size: 1.1rem;
                font-weight: 700;
                font-family: 'Poppins', sans-serif;
                cursor: pointer;
                transition: background 0.2s;
                margin-top: 0.5rem;
            }
            .login-form button:hover {
                background: var(--turquoise-light);
            }
        </style>
</head>
<body>
    <header>
        Chamba
    </header>
    <main class="login-container">
        <h2>Iniciar sesión</h2>
        <form class="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
